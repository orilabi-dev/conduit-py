[project]
name = "conduit-py"
version = "0.2.0"
description = "Unified, opinionated Python client for authenticating and working with Google APIs (Workspace, Cloud, and beyond)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "orilabi-dev", email = "orilabi.dev@gmail.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-bigquery>=3.42.2",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.13.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "conduit_py"
